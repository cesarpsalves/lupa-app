<form hx-post="{% url 'public:waitlist_subscribe' %}"
      hx-target="#waitlist-card"
      hx-swap="innerHTML"
      hx-disabled-elt="find button"
      method="post"
      class="grid gap-4 sm:grid-cols-2">
  {% csrf_token %}

  <div class="sm:col-span-2">
    <label for="id_niche_label" class="block text-sm font-medium
                                       text-slate-700 dark:text-slate-200">
      {{ waitlist_form.niche_label.label }}
    </label>
    <input type="text" id="id_niche_label" name="niche_label" required
           autocomplete="off"
           class="mt-1.5 block w-full rounded-lg shadow-sm transition-colors
                  border-slate-300 bg-white text-slate-900 placeholder-slate-400
                  focus:border-lupa-500 focus:ring-2 focus:ring-lupa-500/40
                  dark:border-slate-700 dark:bg-slate-950/60 dark:text-white dark:placeholder-slate-500"
           placeholder="ex.: barbeiro, personal trainer" />
    {% if waitlist_form.niche_label.errors %}
      <p class="mt-1.5 text-sm text-red-600 dark:text-red-400">{{ waitlist_form.niche_label.errors|join:" " }}</p>
    {% endif %}
  </div>

  <div>
    <label for="id_email" class="block text-sm font-medium text-slate-700 dark:text-slate-200">Email</label>
    <input type="email" id="id_email" name="email" required autocomplete="email"
           class="mt-1.5 block w-full rounded-lg shadow-sm transition-colors
                  border-slate-300 bg-white text-slate-900 placeholder-slate-400
                  focus:border-lupa-500 focus:ring-2 focus:ring-lupa-500/40
                  dark:border-slate-700 dark:bg-slate-950/60 dark:text-white dark:placeholder-slate-500"
           placeholder="seu@email.com" />
    {% if waitlist_form.email.errors %}
      <p class="mt-1.5 text-sm text-red-600 dark:text-red-400">{{ waitlist_form.email.errors|join:" " }}</p>
    {% endif %}
  </div>

  <div>
    <label for="id_name" class="block text-sm font-medium text-slate-700 dark:text-slate-200">
      Nome <span class="text-slate-400 dark:text-slate-500 font-normal">(opcional)</span>
    </label>
    <input type="text" id="id_name" name="name" autocomplete="name"
           class="mt-1.5 block w-full rounded-lg shadow-sm transition-colors
                  border-slate-300 bg-white text-slate-900 placeholder-slate-400
                  focus:border-lupa-500 focus:ring-2 focus:ring-lupa-500/40
                  dark:border-slate-700 dark:bg-slate-950/60 dark:text-white dark:placeholder-slate-500"
           placeholder="Seu nome" />
  </div>

  <div class="sm:col-span-2 flex items-center justify-between gap-3">
    <p class="text-xs text-slate-500 dark:text-slate-500">Você pode cancelar a qualquer momento.</p>
    <button type="submit"
            class="tap-target btn-press inline-flex items-center gap-2 rounded-full bg-lupa-500
                   px-5 py-2.5 text-sm font-medium text-white
                   hover:bg-lupa-600 active:scale-95 transition-all
                   shadow-sm hover:shadow-md hover:shadow-lupa-500/20
                   disabled:opacity-70 disabled:cursor-wait">
      <span class="htmx-request:hidden">Entrar na lista &rarr;</span>
      <span class="hidden htmx-request:inline-flex items-center gap-2">
        <span class="lupa-spinner"></span> Enviando&hellip;
      </span>
    </button>
  </div>
</form>
