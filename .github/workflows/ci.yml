name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Type + Security
    runs-on: ubuntu-latest

    # django-stubs (carregado pelo mypy via pyproject.toml) importa
    # config.settings.dev → base.py, que exige DJANGO_SECRET_KEY.
    # Sem essa env aqui, mypy explode ao introspect settings.
    env:
      DJANGO_SECRET_KEY: "ci-quality-key-not-for-prod"
      DATABASE_URL: "sqlite:///:memory:"
      REDIS_URL: "redis://localhost:6379/0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements/*.in

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-compile --quiet requirements/dev.in -o requirements/dev.txt
          pip-sync requirements/dev.txt

      - name: Ruff lint
        run: ruff check apps config tests

      - name: Ruff format check
        run: ruff format --check apps config tests

      - name: Mypy
        run: mypy apps config

      - name: Bandit (security lint)
        run: bandit -c pyproject.toml -r apps config

      - name: pip-audit (CVE check)
        run: pip-audit -r requirements/dev.txt --strict

  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lupa
          POSTGRES_PASSWORD: lupa
          POSTGRES_DB: lupa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lupa"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 5

    env:
      DJANGO_SECRET_KEY: test-key-not-for-prod
      DATABASE_URL: postgres://lupa:lupa@localhost:5432/lupa_test
      REDIS_URL: redis://localhost:6379/0
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements/*.in

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-compile --quiet requirements/dev.in -o requirements/dev.txt
          pip-sync requirements/dev.txt

      - name: Run migrations
        run: python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

      - name: Pytest + coverage
        run: pytest --cov --cov-report=xml --cov-report=term

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lupa:latest
            ghcr.io/${{ github.repository_owner }}/lupa:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
