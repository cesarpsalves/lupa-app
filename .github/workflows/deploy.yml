name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            cd ~/lupa
            git fetch --all
            git reset --hard origin/main
            export LUPA_TAG=${{ github.event.workflow_run.head_sha }}
            docker compose -f docker/docker-compose.prod.yml pull web
            docker compose -f docker/docker-compose.prod.yml up -d --remove-orphans

            echo "▶ Smoke test"
            sleep 5
            curl -fsS https://lupasolucoes.com/healthz || (echo "Healthcheck failed"; exit 1)
            echo "✓ Deploy concluído"
