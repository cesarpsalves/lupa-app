name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Só roda quando:
    # 1) CI terminou com sucesso, E
    # 2) a Repository Variable DEPLOY_ENABLED == 'true' (setada em
    #    Settings → Secrets and variables → Actions → Variables, depois
    #    que os secrets VPS_* já foram configurados).
    # Antes disso, o job é pulado em vez de falhar.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            # Delega tudo (git pull, docker compose pull/up, healthcheck) pro
            # script idempotente que já roda em deploys manuais. paulo tem
            # NOPASSWD sudo, então funciona em SSH não-interativo.
            sudo LUPA_TAG=${{ github.event.workflow_run.head_sha }} /opt/update-lupa.sh
