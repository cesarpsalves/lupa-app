# Config dinâmica do Traefik pra rotear lupasolucoes.com → lupa-web:8000.
# Versionada aqui porque o Traefik desse VPS usa "providers.file" (não Docker),
# então labels no compose são ignoradas e a fonte da verdade do roteamento
# vive em /opt/traefik/dynamic/lupa.yml.
#
# O scripts/deploy-vps.sh copia este arquivo pra /opt/traefik/dynamic/lupa.yml
# a cada deploy (Traefik recarrega automaticamente — watch: true).

http:
  routers:
    # HTTP (qualquer host) → HTTPS
    lupa-http:
      rule: "Host(`lupasolucoes.com`) || Host(`www.lupasolucoes.com`)"
      entryPoints: [web]
      service: lupa
      middlewares: [lupa-redirect-https]

    # HTTPS no www → 301 pro apex (evita conteúdo duplicado no Google).
    # Prioridade maior que o router apex pra garantir match do www primeiro.
    lupa-www:
      rule: "Host(`www.lupasolucoes.com`)"
      priority: 100
      entryPoints: [websecure]
      service: lupa
      tls:
        certResolver: le
      middlewares: [lupa-www-to-apex]

    # HTTPS no apex → serve o app
    lupa:
      rule: "Host(`lupasolucoes.com`)"
      entryPoints: [websecure]
      service: lupa
      tls:
        certResolver: le

  middlewares:
    lupa-redirect-https:
      redirectScheme:
        scheme: https
        permanent: true
    # www.lupasolucoes.com/<path> → lupasolucoes.com/<path>
    lupa-www-to-apex:
      redirectRegex:
        regex: "^https://www\\.lupasolucoes\\.com/(.*)"
        replacement: "https://lupasolucoes.com/${1}"
        permanent: true

  services:
    lupa:
      loadBalancer:
        servers:
          # Traefik vê o container pela network compartilhada traefik-public.
          # Porta 8000 do gunicorn (definida no Dockerfile EXPOSE).
          - url: "http://lupa-web:8000"
