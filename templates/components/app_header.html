{% load static %}
<header class="sticky top-0 z-40 border-b backdrop-blur transition-colors
               border-slate-200/80 bg-white/85
               dark:border-slate-800/80 dark:bg-slate-950/85">
  <div class="mx-auto flex h-14 max-w-6xl items-center justify-between px-4 sm:px-6">

    <a href="{% url 'app:dashboard' %}" class="flex items-center gap-2 group">
      <img src="{% static 'img/logo.svg' %}" alt="LUPA" class="h-8 w-8" />
      <span class="text-sm font-semibold tracking-tight
                   text-slate-900 dark:text-slate-100">
        {% if current_company %}{{ current_company.name }}{% else %}LUPA{% endif %}
      </span>
    </a>

    <div class="flex items-center gap-2">
      {# Toggle de tema #}
      <button type="button"
              @click="
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('lupa-theme', isDark ? 'dark' : 'light');
              "
              aria-label="Alternar tema"
              class="grid h-9 w-9 place-items-center rounded-full
                     border border-slate-200 hover:bg-slate-100
                     dark:border-slate-800 dark:hover:bg-slate-900 transition-colors">
        <svg class="hidden dark:block h-4 w-4 text-yellow-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="block dark:hidden h-4 w-4 text-slate-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

      {# Menu do usuário #}
      <div x-data="{ open: false }" class="relative">
        <button @click="open = !open" type="button"
                class="grid h-9 w-9 place-items-center rounded-full bg-lupa-500/10
                       text-lupa-500 dark:text-lupa-300 ring-1 ring-lupa-500/30
                       text-sm font-semibold uppercase">
          {{ user.first_name|default:user.email|slice:":1" }}
        </button>

        <div x-show="open" @click.outside="open = false" x-transition
             class="absolute right-0 mt-2 w-56 origin-top-right rounded-xl border p-2 shadow-lg
                    border-slate-200 bg-white
                    dark:border-slate-800 dark:bg-slate-900"
             style="display:none">
          <div class="px-3 py-2 text-xs text-slate-500 dark:text-slate-400 truncate">{{ user.email }}</div>
          <hr class="my-1 border-slate-200 dark:border-slate-800" />
          <form action="{% url 'accounts:logout' %}" method="post">
            {% csrf_token %}
            <button type="submit"
                    class="block w-full text-left px-3 py-2 text-sm rounded-md
                           text-slate-700 hover:bg-slate-100
                           dark:text-slate-300 dark:hover:bg-slate-800">
              Sair
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</header>
