{% load static %}
<header class="sticky top-0 z-40 border-b border-slate-800/80 bg-slate-950/85 backdrop-blur supports-[backdrop-filter]:bg-slate-950/60">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4 sm:px-6">
    <a href="{% url 'public:landing' %}" class="flex items-center gap-3 group">
      <span class="grid h-9 w-9 place-items-center rounded-lg bg-lupa-500/10 text-lupa-100 font-bold ring-1 ring-lupa-500/30">L</span>
      <span class="text-base font-semibold tracking-tight text-slate-100 group-hover:text-white transition-colors">LUPA</span>
    </a>

    <nav class="hidden md:flex items-center gap-8 text-sm text-slate-300" aria-label="Principal">
      <a href="#para-quem" class="hover:text-white transition-colors">Para quem é</a>
      <a href="#como-funciona" class="hover:text-white transition-colors">Como funciona</a>
      <a href="#waitlist" class="hover:text-white transition-colors">Outros nichos</a>
    </nav>

    <div class="flex items-center gap-3">
      {% if user.is_authenticated %}
        <a href="#" class="text-sm text-slate-300 hover:text-white">{{ user.display_name }}</a>
        <form action="{% url 'accounts:logout' %}" method="post" class="inline">
          {% csrf_token %}
          <button type="submit" class="text-sm text-slate-300 hover:text-white">Sair</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}"
           class="hidden sm:inline-block text-sm text-slate-300 hover:text-white">Entrar</a>
        <a href="{% url 'accounts:signup' %}"
           class="inline-flex items-center gap-2 rounded-full bg-lupa-500 px-4 py-2 text-sm font-medium text-white hover:bg-lupa-600 transition-colors shadow-sm">
          Começar grátis
        </a>
      {% endif %}
    </div>
  </div>
</header>
