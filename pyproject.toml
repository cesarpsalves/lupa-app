[project]
name = "lupa"
version = "0.1.0"
description = "Sistema de gestão para prestadores de serviço — começando por fotógrafos"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Paulo Alves", email = "informatica@kfp.com.br" }]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", "staticfiles", "media"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "DJ",   # django
    "S",    # security (bandit subset)
    "SIM",  # simplify
    "TCH",  # type-checking
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length — formatter handles
    "S101",    # assert (ok em testes)
    "DJ001",   # null=True em CharField (decisão consciente em alguns casos)
    "RUF012",  # mutable class default — Django Meta usa muito (indexes=[]) e é seguro
    "N818",    # nome de exception sem sufixo Error — InvalidTransition é claro o bastante
    "TC001",   # typing-only first-party import — micro-otimização, não vale a complexidade
    "TC002",   # typing-only third-party import — idem
    "TC003",   # typing-only stdlib import — idem
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "DJ"]
"**/test_*.py" = ["S", "DJ"]
"**/settings/*.py" = ["S105", "S106", "F405"]   # senhas em settings de dev/test + star imports
"**/management/commands/*.py" = ["S311"]   # random.choice em seeders não é cripto
"manage.py" = ["S"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false   # Django ORM retorna muito Any
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false   # django-stubs varia muito entre versões
disallow_untyped_defs = false   # gradual typing — apertamos depois
check_untyped_defs = true
no_implicit_optional = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/", "staticfiles/", "media/"]
# Códigos desabilitados: típicos de Django dinâmico (manager, queryset,
# User|AnonymousUser, atributos via setattr). Cobertos por testes em runtime.
disable_error_code = ["attr-defined", "misc", "union-attr", "arg-type", "index"]

[[tool.mypy.overrides]]
module = [
    "weasyprint.*", "django_htmx.*", "axes.*", "allauth.*",
    "environ", "environ.*",
    "django_otp.*", "debug_toolbar.*", "django_extensions.*",
    "crispy_forms.*", "crispy_tailwind.*", "template_partials.*",
    "django_q.*", "anymail.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "--reuse-db",
    "--strict-markers",
    "--tb=short",
    "-ra",
]
markers = [
    "slow: marca testes lentos",
    "integration: requer banco e dependências externas",
    "tenant: testes específicos de isolamento multi-tenant",
]
filterwarnings = [
    "ignore::DeprecationWarning:django.*",
]

[tool.coverage.run]
source = ["apps", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "manage.py",
    "config/wsgi.py",
    "config/asgi.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
# Threshold gradual: começa em 60% (atual ≈ 66%), sobe pra 70% quando
# Fase 4 ganhar mais testes (tickets/views.py está em 28%, scheduling
# em 35%). Não baixar abaixo de 60 sem justificativa em PR.
fail_under = 60
show_missing = true
skip_covered = false
