# Compose para produção. Integra com o Traefik existente em /opt/traefik/
# (reverse proxy do VPS que serve ~30 projetos). Traefik faz SSL via
# Let's Encrypt (resolver "le", HTTP-01 challenge).
#
# Variáveis sensíveis em /opt/.env.lupa (chmod 600).
# Imagem buildada pelo CI e publicada em ghcr.io/cesarpsalves/lupa:<tag>.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: /opt/.env.lupa
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lupa_v2}
      POSTGRES_USER: ${POSTGRES_USER:-lupa_app}
    volumes:
      - lupa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lupa_app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lupa-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    networks:
      - lupa-internal

  web:
    image: ghcr.io/cesarpsalves/lupa:${LUPA_TAG:-latest}
    container_name: lupa-web
    restart: unless-stopped
    env_file: /opt/.env.lupa
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - lupa-static:/app/staticfiles
      - lupa-media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lupa-internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"

      # HTTP → HTTPS redirect
      - "traefik.http.routers.lupa-http.rule=Host(`lupasolucoes.com`) || Host(`www.lupasolucoes.com`)"
      - "traefik.http.routers.lupa-http.entrypoints=web"
      - "traefik.http.routers.lupa-http.middlewares=lupa-redirect-https"
      - "traefik.http.middlewares.lupa-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.lupa-redirect-https.redirectscheme.permanent=true"

      # HTTPS (Traefik termina TLS, Django recebe HTTP interno)
      - "traefik.http.routers.lupa.rule=Host(`lupasolucoes.com`) || Host(`www.lupasolucoes.com`)"
      - "traefik.http.routers.lupa.entrypoints=websecure"
      - "traefik.http.routers.lupa.tls=true"
      - "traefik.http.routers.lupa.tls.certresolver=le"
      - "traefik.http.services.lupa.loadbalancer.server.port=8000"

      # Security headers + X-Forwarded-Proto pro Django saber que é HTTPS
      - "traefik.http.routers.lupa.middlewares=lupa-headers"
      - "traefik.http.middlewares.lupa-headers.headers.customRequestHeaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.lupa-headers.headers.customResponseHeaders.X-Frame-Options=DENY"
      - "traefik.http.middlewares.lupa-headers.headers.customResponseHeaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.lupa-headers.headers.customResponseHeaders.Referrer-Policy=same-origin"
      - "traefik.http.middlewares.lupa-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.lupa-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.lupa-headers.headers.stsPreload=true"

volumes:
  lupa-pgdata:
  lupa-static:
  lupa-media:

networks:
  lupa-internal:
  traefik-public:
    external: true
