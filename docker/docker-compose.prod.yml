# Compose para produção. Variáveis em /etc/lupa/lupa.env (chmod 600).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: /etc/lupa/lupa.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lupa_v2}
      POSTGRES_USER: ${POSTGRES_USER:-lupa_app}
    volumes:
      - lupa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lupa_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  web:
    image: ghcr.io/cesarpsalves/lupa:${LUPA_TAG:-latest}
    restart: unless-stopped
    env_file: /etc/lupa/lupa.env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose:
      - "8000"
    volumes:
      - lupa-static:/app/staticfiles
      - lupa-media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # NGINX_CONF aponta pra nginx.conf (HTTPS) OU nginx.bootstrap.conf (HTTP-only,
      # usado no primeiro setup antes do Certbot emitir o cert).
      - ./${NGINX_CONF:-nginx.conf}:/etc/nginx/conf.d/lupa.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - lupa-static:/var/www/static:ro
      - lupa-media:/var/www/media:ro

volumes:
  lupa-pgdata:
  lupa-static:
  lupa-media:
