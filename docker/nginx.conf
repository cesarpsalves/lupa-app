limit_req_zone $binary_remote_addr zone=lupa_rate:10m rate=20r/s;

upstream lupa_web {
    server web:8000;
    keepalive 32;
}

# ── Redirect HTTP → HTTPS ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name lupasolucoes.com www.lupasolucoes.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lupasolucoes.com www.lupasolucoes.com;

    ssl_certificate     /etc/letsencrypt/live/lupasolucoes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lupasolucoes.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Headers de segurança ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 25M;
    client_body_timeout 60s;

    # ── Bloqueio de paths sensíveis ──
    location ~ /\.(git|env|hg|svn) { deny all; return 404; }
    location ~ \.(php|asp|aspx|jsp)$ { return 404; }
    location ~ ^/(wp-admin|wp-login|administrator|phpmyadmin) { return 404; }

    # ── Estáticos / mídia ──
    location /static/ { alias /var/www/static/; expires 30d; access_log off; }
    location /media/  { alias /var/www/media/;  expires  7d; access_log off; }

    # ── App ──
    location / {
        limit_req zone=lupa_rate burst=40 nodelay;
        proxy_pass http://lupa_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
