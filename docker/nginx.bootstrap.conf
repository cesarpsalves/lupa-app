# Config HTTP-only usada APENAS no primeiro setup, antes do Certbot emitir
# o cert TLS. Depois que /etc/letsencrypt/live/lupasolucoes.com/ existir, o
# compose passa a usar nginx.conf (NGINX_CONF=nginx.conf).
#
# Diferença pra nginx.conf: não tem server block 443 (sem SSL) e não redireciona
# HTTP → HTTPS (senão Certbot --webroot não consegue completar o challenge).

upstream lupa_web {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name lupasolucoes.com www.lupasolucoes.com;

    # ACME HTTP-01 challenge do Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Estáticos / mídia (pra smoke test pelo IP antes do DNS apontar)
    location /static/ { alias /var/www/static/; expires 30d; access_log off; }
    location /media/  { alias /var/www/media/;  expires  7d; access_log off; }

    # App em HTTP enquanto o cert não sai
    location / {
        proxy_pass http://lupa_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
